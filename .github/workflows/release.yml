name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: custom/package-lock.json
      - name: Install dependencies
        run: |
          if ! npm ci > npm-install.log 2>&1; then
            cat npm-install.log
            node <<'NODE'
          const fs = require('node:fs');
          const errors = fs.readFileSync('npm-install.log', 'utf8').split(/\r?\n/)
            .filter(line => /^npm (?:ERR!|error)/.test(line)).slice(0, 12);
          for (const line of errors) {
            console.log('::error title=Dependency installation::' + line.replace(/%/g, '%25'));
          }
          NODE
            exit 1
          fi
          cat npm-install.log
        working-directory: custom
      - name: Run test suite
        run: npm test
        working-directory: custom
      - name: Prepare release notes
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${release_version} " '
            index($0, heading) == 1 { found = 1 }
            found && /^## [0-9]/ && index($0, heading) != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --verify-tag --title "NWPUOJ $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "NWPUOJ $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
