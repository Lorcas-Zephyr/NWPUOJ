name: nwpuoj

# Components:
# - SYZOJ Web
# - MariaDB
# - Redis
# - SYZOJ Judge
# - RabbitMQ
#
# Recommended for:
# - Web on self-hosted machine or VPS
# - Judge on the same host
#
# Notes:
# - MariaDB root password is empty (but root login only permitted inside container)
# - Redis and RabbitMQ persistent are not enabled
# - Only one runner is configured in this configuration, but you can copy and replace 1 to 2 to add more
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: nwpuoj-web:v2.0.1
    restart: unless-stopped
    depends_on:
      judge-control: { condition: service_healthy }
    ports:
      - "${SYZOJ_WEB_BIND:-0.0.0.0}:${SYZOJ_WEB_PORT:-80}:80"
    tmpfs:
      - /app/sessions
    volumes:
      - config:/app/config
      - uploads:/app/uploads
      - judge-control-auth:/run/judge-control:ro
      - ./custom/favicon.png:/app/static/self/favicon.png:ro
      - ./custom/header.ejs:/app/views/header.ejs:ro
      - ./custom/views/app_header.ejs:/app/views/app_header.ejs:ro
      - ./custom/views/app_footer.ejs:/app/views/app_footer.ejs:ro
      - ./custom/views/app_page_state.ejs:/app/views/app_page_state.ejs:ro
