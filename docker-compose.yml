      - SYZOJ_AUTH_VERIFY_WORKERS=${SYZOJ_AUTH_VERIFY_WORKERS:-16}
      - SYZOJ_V2_ONLY=${SYZOJ_V2_ONLY:-true}
      - JUDGE_CONTROL_URL=http://judge-control:3000
      - JUDGE_CONTROL_TOKEN_FILE=/run/judge-control/token
      - NODE_PATH=/app/custom-node-modules:/app/node_modules
      - NODE_OPTIONS=--require=/app/module-order.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - default
      - judge-control
  judge-control:
    image: menci/syzoj-web@sha256:ee6fa55686af32ec92a2cefe6e1df1022b9e4ebd7f59fbf75a0bf17c7f3ae747
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      - JUDGE_CONTROL_PORT=3000
      - JUDGE_CONTROL_TOKEN_FILE=/run/judge-control/token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./custom/judge-control.js:/app/judge-control.js:ro
      - judge-control-auth:/run/judge-control
    command: node /app/judge-control.js
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - judge-control
  mariadb:
    image: mariadb
    restart: unless-stopped
    volumes:
      - database:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_ROOT_HOST=localhost
      - MYSQL_DATABASE=syzoj
      - MYSQL_USER=syzoj
      - MYSQL_PASSWORD=syzoj
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 5
  redis:
    image: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      start_period: 10s
      interval: 5s
      timeout: 1s
      retries: 5
  judge-daemon:
    image: menci/syzoj-judge
    restart: unless-stopped
    scale: 16
    volumes:
      - config:/app/config
      - uploads:/app/testdata
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    env_file: env-app # For SYZOJ_WEB_SECRET_JUDGE
    environment:
      - TZ=Asia/Shanghai
      - SYZOJ_WEB_UOJ_USERNAME=
      - SYZOJ_WEB_UOJ_PASSWORD=
      - SYZOJ_WEB_HDU_USERNAME=
      - SYZOJ_WEB_HDU_PASSWORD=
      - SYZOJ_WEB_POJ_USERNAME=
      - SYZOJ_WEB_POJ_PASSWORD=
      - SYZOJ_JUDGE_WEB_URL=http://web
      - SYZOJ_JUDGE_RABBITMQ_URI=amqp://rabbitmq/
      - SYZOJ_JUDGE_TESTDATA_PATH=/app/testdata/testdata # "uploads" is mounted on /app/testdata
      - SYZOJ_JUDGE_REDIS_URI=redis://redis:6379
    command: daemon
  rabbitmq:
    image: rabbitmq:3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 5
  judge-runner-1:
    image: menci/syzoj-judge
    restart: unless-stopped
    scale: 16
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - config:/app/config
      - uploads:/app/testdata
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      - TZ=Asia/Shanghai
      - SYZOJ_JUDGE_RABBITMQ_URI=amqp://rabbitmq/
      - SYZOJ_JUDGE_TESTDATA_PATH=/app/testdata/testdata # "uploads" is mounted on /app/testdata
      - SYZOJ_JUDGE_REDIS_URI=redis://redis:6379
      - SYZOJ_JUDGE_RUNNER_INSTANCE=1
      - SYZOJ_JUDGE_CGROUP=judge-runner-1
    command: runner
volumes:
  config:
    name: nwpuoj_config
  uploads:
    name: nwpuoj_uploads
  database:
    name: nwpuoj_database
  judge-control-auth:
    name: nwpuoj_judge-control-auth
networks:
  judge-control:
    internal: true
